apiVersion: apps/v1
kind: Deployment

metadata:
  name: notes-app
  namespace: notes-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notes-app

  template:

    metadata:
      labels:
        app: notes-app

    spec:

      imagePullSecrets:
      - name: ecr-secret

      containers:

      - name: notes-app

        image: 236782813851.dkr.ecr.us-east-1.amazonaws.com/notes-app:latest

        ports:
        - containerPort: 8080